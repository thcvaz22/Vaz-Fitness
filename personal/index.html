    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0,#fff3a7 0,transparent 24%),var(--bg);min-height:100vh}.hidden{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,44px);background:rgba(246,246,243,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.05)}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:15px;background:var(--yellow);display:grid;place-items:center;font-weight:950;color:#111;box-shadow:0 8px 24px rgba(245,196,0,.3)}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:10px;margin-top:2px}.user-chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:9px}.user-chip span{width:28px;height:28px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.user-chip small{color:var(--muted)}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;max-width:1500px;margin:0 auto;padding:26px clamp(16px,4vw,42px) 80px}.sidebar{position:sticky;top:96px;height:max-content;background:#161616;color:#fff;border-radius:28px;padding:16px;box-shadow:var(--shadow)}.nav-btn{width:100%;border:0;background:transparent;color:#aaa;border-radius:16px;padding:13px 14px;text-align:left;font-weight:800;margin:3px 0}.nav-btn.active,.nav-btn:hover{background:#2b2b2b;color:#fff}.nav-btn.active{box-shadow:inset 3px 0 var(--yellow)}.side-note{margin-top:18px;border-top:1px solid #333;padding:16px 8px 4px;color:#999;font-size:11px;line-height:1.5}.content{min-width:0}.hero{background:linear-gradient(135deg,#19191 us:25px;padding:20px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.back-btn{display:none}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;letter-spacing:.05em}.block-preview{background:#151515;color:#fff;border-radius:22px;padding:20px;margin-top:13px}.block-preview h3{margin:0 0 7px}.block-preview p{color:#bbb;margin:0}.mobile-nav{display:none}
    @media(max-width:980px){.layout{grid-template-columns:1fr;padding-bottom:100px}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:12px;left:12px;right:12px;z-index:30;background:#171717;border-radius:22px;padding:8px;box-shadow:var(--shadow)}.mobile-nav button{flex:1;border:0;background:transparent;color:#aaa;border-radius:15px;padding:10px 4px;font-size:10px}.mobile-nav button.active{background:#333;color:#fff}.grid.four{grid-template-columns:1fr 1fr}.back-btn{display:inline-block}.day-top{grid-template-columns:80px minmax(0,1fr) 90px}.day-top>*:nth-child(4){display:none}.exercise-editor{grid-template-columns:1fr 70px 70px}.exercise-editor>*:nth-child(2),.exercise-editor>*:nth-child(5),.exercise-editor>*:nth-child(6){display:none}}
    @media(max-width:600px){.topbar{padding:13px 15px}.brand small,.user-chip div{display:none}.layout{padding:15px 12px 95px}.hero{padding:21px;border-radius:25px}.hero h1{font-size:34px}.grid.four,.grid.two,.metric-grid,.profile-grid{grid-template-columns:1fr 1fr}.client-row{grid-template-columns:40px minmax(0,1fr) auto}.client-row .open-label{display:none}.client-head{display:block}.client-title h1{font-size:28px}.client-head-actions{margin-top:10px}.claim-row{grid-template-columns:1fr}.plan-toolbar{align-items:flex-start;flex-direction:column}.day-top{grid-template-columns:1fr 1fr}.day-top button{grid-column:2}.exercise-editor{grid-template-columns:1fr 60px 60px}.metric-grid .metric strong{font-size:17px}}
