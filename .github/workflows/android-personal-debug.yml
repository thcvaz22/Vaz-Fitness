name: Vaz Personal Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'personal/**'
      - 'api/personal-ops.js'
      - 'api/personal-auth.js'
      - 'api/health.js'
      - 'api/vf.js'
      - 'api/branding.js'
      - 'lib/admin-handler.js'
      - 'lib/training-library-handler.js'
      - 'lib/cors.js'
      - 'capacitor.personal.config.json'
      - 'scripts/build-personal-native-v2.mjs'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/android-personal-debug.yml'

jobs:
  build-personal-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate Vaz Personal 2.0 JavaScript
        run: node --check personal/app-v2.js && node --check personal/training-library-v2.js && node --check api/personal-auth.js && node --check api/health.js && node --check api/personal-ops.js && node --check lib/admin-handler.js && node --check lib/training-library-handler.js
      - name: Prepare Vaz Personal 2.0 bundle
        run: node scripts/build-personal-native-v2.mjs
      - name: Validate native bundle
        run: node --check www-personal/app-v2.js && node --check www-personal/training-library-v2.js
      - name: Use Vaz Personal Capacitor config
        run: cp capacitor.personal.config.json capacitor.config.json
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Vaz Personal APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaz-Personal-Android-v3-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
