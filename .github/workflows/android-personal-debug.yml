name: Vaz Personal Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'personal/**'
      - 'api/personal-ops.js'
      - 'api/personal-auth.js'
      - 'api/health.js'
      - 'api/vf.js'
      - 'api/branding.js'
      - 'lib/admin-handler.js'
      - 'lib/training-library-handler.js'
      - 'lib/personal-tools-handler.js'
      - 'lib/personal-plan-handler.js'
      - 'lib/self-coached-access.js'
      - 'lib/exercise-catalog-v4.js'
      - 'lib/exercise-catalog-v5.js'
      - 'lib/cors.js'
      - 'capacitor.personal.config.json'
      - 'scripts/build-personal-native-v2.mjs'
      - 'scripts/configure-app-icon.mjs'
      - 'scripts/test-plan-history-v13.mjs'
      - 'scripts/test-exercise-picker-v14.mjs'
      - 'scripts/test-today-center-v15.mjs'
      - 'scripts/test-exercise-library-v16.mjs'
      - 'scripts/test-settings-brand-v17.mjs'
      - 'scripts/test-finance-v18.mjs'
      - 'vercel.json'
      - 'package.json'
      - 'release.json'
      - 'version.json'
      - '.github/workflows/android-personal-debug.yml'

jobs:
  build-personal-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate Vaz Personal JavaScript
        run: |
          node --check personal/app-v2.js
          node --check personal/training-library-v2.js
          node --check personal/exercise-catalog-v4.js
          node --check personal/exercise-catalog-v5.js
          node --check personal/coach-tools-v4.js
          node --check personal/advanced-v8.js
          node --check personal/safety-v9.js
          node --check personal/exercise-gallery-v10.js
          node --check personal/visual-system-v11.js
          node --check personal/plan-request-workflow-v12.js
          node --check personal/plan-history-v13.js
          node --check personal/training-library-v2.js
          node --check personal/coach-tools-v4.js
          node scripts/test-exercise-picker-v14.mjs
          node --check personal/today-center-v15.js
          node --check personal/aion-action-plan-v20.js
          node --check personal/client-360-v22.js
          node --check personal/student-planning-v25.js
          node --check personal/run-planning-v26.js
          node scripts/test-today-center-v15.mjs
          node --check api/personal-auth.js
          node --check api/health.js
          node --check api/personal-ops.js
          node --check lib/admin-handler.js
          node --check lib/training-library-handler.js
          node --check lib/personal-tools-handler.js
          node --check lib/personal-plan-handler.js
          node --check lib/self-coached-access.js
          node --check lib/exercise-catalog-v4.js
          node --check lib/exercise-catalog-v5.js
          node scripts/test-personal-fitness-access.mjs
          node scripts/test-plan-history-v13.mjs
          node scripts/test-exercise-library-v16.mjs
          node scripts/test-settings-brand-v17.mjs
          node --check personal/finance-v18.js
          node scripts/test-finance-v18.mjs
          npm run release:check
          node scripts/test-finalization-v19.mjs
          node scripts/test-rest-extra-v21.mjs
          node scripts/test-pre1-v23.mjs
      - name: Prepare Vaz Personal native bundle
        run: node scripts/build-personal-native-v2.mjs
      - name: Validate native bundle
        run: |
          test -f www-personal/safety-v9.js
          test -f www-personal/exercise-gallery-v10.js
          test -f www-personal/exercise-catalog-v5.js
          test -f www-personal/visual-system-v11.js
          test -f www-personal/plan-request-workflow-v12.js
          test -f www-personal/plan-history-v13.js
          test -f www-personal/exercise-picker-v14.css
          test -f www-personal/today-center-v15.js
          test -f www-personal/aion-action-plan-v20.js
          test -f www-personal/client-360-v22.js
          test -f www-personal/student-planning-v25.js
          test -f www-personal/run-planning-v26.js
          test -f www-personal/today-center-v15.css
          test -f www-personal/finance-v18.js
          test -f www-personal/finance-v18.css
          node --check www-personal/app-v2.js
          node --check www-personal/training-library-v2.js
          node --check www-personal/exercise-catalog-v4.js
          node --check www-personal/exercise-catalog-v5.js
          node --check www-personal/coach-tools-v4.js
          node --check www-personal/advanced-v8.js
          node --check www-personal/safety-v9.js
          node --check www-personal/exercise-gallery-v10.js
          node --check www-personal/visual-system-v11.js
          node --check www-personal/plan-history-v13.js
          node --check www-personal/today-center-v15.js
          node --check www-personal/aion-action-plan-v20.js
          node --check www-personal/client-360-v22.js
          node --check www-personal/student-planning-v25.js
          node --check www-personal/run-planning-v26.js
          node --check www-personal/finance-v18.js
          grep -q "safety-v9.js" www-personal/index.html
          grep -q "exercise-gallery-v10.js" www-personal/index.html
          grep -q "exercise-catalog-v5.js" www-personal/index.html
          grep -q "visual-system-v11.js" www-personal/index.html
          grep -q "plan-request-workflow-v12.js" www-personal/index.html
          grep -q "plan-history-v13.js" www-personal/index.html
          grep -q "exercise-picker-v14.css" www-personal/index.html
          grep -q "today-center-v15.js" www-personal/index.html
          grep -q "aion-action-plan-v20.js" www-personal/index.html
          grep -q "client-360-v22.js" www-personal/index.html
          grep -q "student-planning-v25.js" www-personal/index.html
          grep -q "run-planning-v26.js" www-personal/index.html
          grep -q "today-center-v15.css" www-personal/index.html
          grep -q "finance-v18.js" www-personal/index.html
          grep -q "finance-v18.css" www-personal/index.html
      - name: Use Vaz Personal Capacitor config
        run: cp capacitor.personal.config.json capacitor.config.json
      - name: Create Android project
        run: npx cap add android
      - name: Apply unified release version
        run: node scripts/configure-android-version.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply Vaz Personal launcher icon
        run: node scripts/configure-app-icon.mjs personal
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Vaz Personal APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaz-Personal-Android-v5-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
