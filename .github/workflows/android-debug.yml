name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-*.js'
      - 'index.html'
      - 'styles.css'
      - 'icon.svg'
      - 'native-entry.js'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'api/**'
      - 'lib/**'
      - 'package.json'
      - '.github/workflows/android-debug.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate authentication and UX flows
        run: |
          node --check app-auth-entry-v8.js
          node --check app-ux-v9.js
          node --check app-polish-v2.js
          node --check app-plan-request-v10.js
          node --check app-plan-sync-v11.js
          node --check api/vf.js
          node --check lib/self-coached-access.js
          node scripts/test-auth-entry.mjs
          node scripts/test-personal-fitness-access.mjs
      - name: Prepare native web bundle
        run: npm run native:prepare
      - name: Validate packaged experience
        run: |
          test -f www/app-auth-entry-v8.js
          test -f www/app-ux-v9.js
          test -f www/app-plan-request-v10.js
          test -f www/app-plan-sync-v11.js
          node --check www/app-auth-entry-v8.js
          node --check www/app-ux-v9.js
          node --check www/app-plan-request-v10.js
          node --check www/app-plan-sync-v11.js
          grep -q "app-auth-entry-v8.js" www/app-polish-v2.js
          grep -q "app-ux-v9.js" www/app-polish-v2.js
          grep -q "app-plan-request-v10.js" www/app-polish-v2.js
          grep -q "app-plan-sync-v11.js" www/app-polish-v2.js
      - name: Create Android project
        run: npx cap add android
      - name: Configure native permissions
        run: node scripts/configure-native.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply Vaz Fitness launcher icon
        run: node scripts/configure-app-icon.mjs fitness
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Vaz Fitness APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaz-Fitness-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
