name: Android Signed Release APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-*.js'
      - 'personal/**'
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'scripts/**'
      - 'capacitor*.json'
      - 'index.html'
      - 'styles.css'
      - 'package.json'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: 0.5.3
      APP_VERSION_CODE: 53
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate source
        run: |
          node --check app-plan-request-v10.js
          node --check app-plan-sync-v11.js
          node --check personal/advanced-v8.js
          node --check personal/plan-request-workflow-v12.js
          node --check personal/safety-v9.js
          node --check api/vf.js
          node --check api/personal-ops.js
          node --check lib/personal-tools-handler.js
          node --check lib/self-coached-access.js
          node scripts/test-auth-entry.mjs
          node scripts/test-plan-request-v10.mjs
          node scripts/test-personal-fitness-access.mjs
      - name: Decode permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vaz-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vaz-apps-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Vaz Personal APK
        run: |
          node scripts/build-personal-native-v2.mjs
          cp capacitor.personal.config.json capacitor.config.json
          npx cap add android
          npx cap sync android
          node scripts/configure-app-icon.mjs personal
          node scripts/configure-release-signing.mjs
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk Vaz-Personal.apk
          rm -rf android
      - name: Build signed Vaz Fitness APK
        run: |
          git show HEAD:capacitor.config.json > capacitor.config.json
          npm run native:prepare
          npx cap add android
          node scripts/configure-native.mjs
          npx cap sync android
          node scripts/configure-app-icon.mjs fitness
          node scripts/configure-release-signing.mjs
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk Vaz-Fitness.apk
      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose Vaz-Personal.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose Vaz-Fitness.apk
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vaz-Apps-Android-Release-0.5.3
          path: |
            Vaz-Personal.apk
            Vaz-Fitness.apk
          retention-days: 90
      - name: Publish stable download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vaz-apps-latest >/dev/null 2>&1 || gh release create vaz-apps-latest --title "Vaz Apps Android 0.5.3" --notes "Versões oficiais assinadas do Vaz Fitness e Vaz Personal."
          gh release edit vaz-apps-latest --title "Vaz Apps Android 0.5.3" --notes "Versões oficiais assinadas do Vaz Fitness e Vaz Personal."
          gh release upload vaz-apps-latest Vaz-Personal.apk Vaz-Fitness.apk --clobber
