name: Personal Plan Validation

on:
  push:
    branches: [personal-plan-limits]
  workflow_dispatch:

jobs:
  validate-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plan modules
        run: |
          node --check lib/personal-plan-handler.js
          node --check api/health.js
          node --check personal/plans-v5.js
      - name: Build Vaz Personal native bundle
        run: node scripts/build-personal-native-v2.mjs
      - name: Validate packaged plan module
        run: |
          test -f www-personal/plans-v5.js
          node --check www-personal/plans-v5.js
          grep -q "plans-v5.js" www-personal/index.html
